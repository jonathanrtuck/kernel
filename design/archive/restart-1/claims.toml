# Kernel Design Claims - **Deprecated**
#
# Single source of truth for design decisions and their rationale.
#
# Status:     canonical (settled), signal (strong direction), working (exploratory)
# Confidence: certain, high, medium
# Scope:      kernel, cpu, memory, ipc, architecture, hardware

[[claim]]
id = "three-irreducible-responsibilities"
statement = "The kernel has exactly three irreducible responsibilities: multiplex CPU/RAM, route interrupts/faults, manage the privilege boundary"
status = "canonical"
confidence = "certain"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
The kernel exists because hardware restricts certain operations to a privileged \
exception level. The irreducible responsibilities are exactly the operations \
silicon won't let userspace perform: programming the MMU and preemption timer \
(CPU/RAM multiplexing), receiving exceptions via VBAR_EL1 and GIC (interrupt/fault \
routing), and save/restore plus eret (privilege boundary management). Everything \
else — process lifecycle, IPC, capabilities, scheduling policy — is built on top \
and must earn its way in."""

[[claim]]
id = "kernel-owns-scheduling-policy"
statement = "The kernel owns both scheduling mechanism and policy — userspace does M:N threading on top"
status = "canonical"
confidence = "certain"
scope = ["kernel", "cpu"]
date = "2026-04-04"
rationale = """
Scheduling policy is tightly coupled with the events that trigger it (timer \
interrupt, IPC block, fault, interrupt arrival). Pushing policy to userspace \
creates a chatty upcall protocol costing more than the simplicity it buys — \
every kernel event affecting scheduling would require an upcall. The kernel is \
already in the loop for all these events; deciding right there avoids the round \
trip. Historical evidence: Scheduler Activations (NetBSD, experimental systems) \
were tried; the industry converged on kernel scheduling with M:N threading."""

[[claim]]
id = "external-object-model"
statement = "The kernel's external object model has three types: Objects, memory objects (units of space), and time objects (units of time). An Object is a register set that binds to memory objects and time objects. Space and time are symmetric resources — created, bound to Objects, and shared using the same mechanism."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
Derived from first principles: an executing entity needs space (memory for \
instructions and data) and time (CPU to execute). Space and time are the only \
two irreducible resources. Both are managed the same way: the kernel creates \
resource objects, binds them to Objects, and sharing means multiple Objects \
bound to the same resource. An Object's structure is its set of mapped memory \
objects; its activity is fueled by bound time objects. The Object itself is \
just a register set (PC, SP, general-purpose registers) — the execution \
identity. Address spaces, page tables, physical memory, and cores are \
kernel-internal implementation details, not exposed. Any additional object \
types must be justified by concrete scenarios these three cannot serve."""

[[claim]]
id = "structure-precondition-for-activity"
statement = "Structure is a practical precondition for activity — an Object without mapped memory objects will fault immediately when given time. The kernel does not enforce this constraint; the hardware does (MMU fault). An Object can exist without space or time in any combination."
status = "signal"
confidence = "certain"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
An Object's register set (PC) must point into mapped memory for execution to \
proceed. Without mapped memory objects, the first instruction fetch faults. \
The kernel does not need to pre-check this — the MMU enforces it naturally. \
This keeps the kernel simpler: no special validation, just fault handling. \
An Object can exist with space but no time (alive, not awake), with neither \
(just a register set, perhaps during setup), or with both (running). The \
'time without space' case is handled by the same fault delivery mechanism \
as any other invalid memory access."""

[[claim]]
id = "authority-is-os-governance"
statement = "Authority (capabilities/permissions) is the OS's governance over structure and activity, not a resource the program itself needs. Programs act; the kernel constrains."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
From the program's perspective, it simply executes instructions and accesses \
memory. It has no concept of 'permission' — it acts, and the hardware + kernel \
constrain what happens (MMU faults on invalid access, kernel rejects unauthorized \
syscalls). Capabilities are the kernel's bookkeeping for deciding whether to \
grant requests. They govern who gets space, who gets time, and who receives \
events. This framing prevents treating authority as a program-level resource \
on par with space and time. \
\
The implementation: authority is encoded in the kernel's existing operational \
data structures — page tables (Space permissions), scheduler state (Time \
allocation), routing rules (event delivery), and the supervision tree (lifecycle \
and resource control). No separate capability objects, handle tables, bearer \
tokens, or ledger. The tree IS the capability space. See downstream claims: \
capability-encoded-in-tree, space-permission-vocabulary, reply-paths-kernel-internal."""

[[claim]]
id = "dynamic-resource-bindings"
statement = "Resource bindings (memory objects and time objects to Objects) are dynamic — they can be added and removed at any time. This generalizes thread migration (rebinding all space) and scheduling changes (rebinding time) as ordinary resource operations, not special mechanisms."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
If space and time are symmetric resources bound to Objects, and bindings can \
change, then many operations that appear special in other systems become \
general cases. Mapping a new memory object is loading a library. Unmapping \
one is unloading it. Rebinding all memory objects at once during IPC is thread \
migration. Changing time bindings is rescheduling. None of these require \
special mechanisms — they are all instances of 'change which resources an \
Object is bound to.' The abstraction absorbs the edge cases."""

[[claim]]
id = "memory-object-abstraction"
statement = "Memory is exposed as byte-sized objects with a two-step create-then-map model — backing type on the object, permissions on the mapping"
status = "canonical"
confidence = "high"
scope = ["kernel", "memory"]
date = "2026-04-04"
rationale = """
Memory objects are kernel-managed entities with a two-step model: create (with \
size and backing type), then map (into an Object with permissions). These are \
independent operations — a memory object exists before mapping, the same memory \
object maps into multiple Objects (sharing), unmapping doesn't destroy it. \
Backing type (anonymous, device MMIO, file-backed) is a memory object property. \
Permissions (read/write/execute) attach to the mapping, not the memory object — \
same memory object can be read-only in one Object, read-write in another. Sharing \
is natural: another Object maps the same memory object into its own space."""

[[claim]]
id = "page-size-hidden"
statement = "Page size is an implementation detail of the MMU and does not leak into the kernel interface"
status = "canonical"
confidence = "high"
scope = ["kernel", "memory"]
date = "2026-04-04"
rationale = """
Every argument for leaking page size follows the same structure: MMU operates at \
page granularity → some operation is constrained → userspace must know. Every \
argument collapses the same way: redesign at object granularity and the leak \
disappears. Shared memory alignment → map whole objects. Device MMIO → kernel \
maps region, driver accesses offsets. TLB pressure → hint API (LARGE_MAPPINGS). \
Protection granularity → per-mapping permissions. Page size is essential \
complexity of the MMU leaf node; the memory object interface absorbs it. An \
optional query_page_size() can exist for rare expert use."""

[[claim]]
id = "slab-packing-isolation"
statement = "Slab packing is safe within one address space, forbidden across address spaces — the kernel never enforces sub-page isolation"
status = "canonical"
confidence = "certain"
scope = ["kernel", "memory"]
date = "2026-04-04"
rationale = """
The MMU enforces isolation at page granularity. Objects in the same address space \
share a trust boundary, so packing small objects into one page is a resource \
optimization with no isolation implications. Across address spaces, packing would \
give each side access to the other's data. The kernel uses hardware MMU as the \
sole isolation mechanism and never replicates protection at finer granularity in \
software. Slab-packed objects transparently promote to own page(s) when shared."""

[[claim]]
id = "lazy-allocation"
statement = "Creating a memory object does not allocate physical pages immediately — the kernel uses demand paging"
status = "signal"
confidence = "high"
scope = ["kernel", "memory"]
date = "2026-04-04"
rationale = """
Deferring physical allocation until pages are touched avoids wasting RAM on \
allocated-but-unused memory. Page faults become normal memory management (triggering \
allocation), not just errors. The fault handler must distinguish valid lazy \
allocation from illegal access."""

[[claim]]
id = "overcommit-policy-open"
statement = "Policy for physical RAM exhaustion with outstanding lazy commitments is an open design question"
status = "working"
confidence = "medium"
scope = ["kernel", "memory"]
date = "2026-04-04"
rationale = """
When physical RAM is exhausted but lazy commitments remain, the kernel must \
choose: deny allocation up front (no overcommit), kill something (OOM killer), \
block until memory is available, or report an error. Each has different tradeoffs \
for predictability, utilization, and complexity. Not yet settled."""

[[claim]]
id = "ipc-is-kernel-concern"
statement = "Cross-isolation-boundary communication is a kernel concern — the kernel created the wall, so it provides the door"
status = "canonical"
confidence = "certain"
scope = ["kernel", "ipc"]
date = "2026-04-04"
rationale = """
The kernel enforces memory isolation via the MMU. Threads in different address \
spaces cannot see each other's memory, so they cannot communicate without kernel \
involvement. Cross-boundary communication reduces to three primitives the kernel \
already provides: shared memory setup (page table modification), waking sleeping \
threads (scheduler), and transferring capabilities (trusted authority). Message \
format, buffering, and protocols live in userspace libraries on top."""

[[claim]]
id = "events-carry-resources"
statement = "Events can carry resource handles (Time, Space, routing capabilities). Sync/async is not a kernel distinction — it emerges from whether the sender includes its Time handle. A sender that donates Time cannot run (effectively blocked). A sender that keeps Time continues (effectively async). The kernel just transfers resources; the behavior is emergent."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-05"
rationale = """
The kernel has one operation: emit an event, optionally including \
resource handles. If the sender includes its Time handle, the sender \
has no Time and cannot be scheduled — it is effectively blocked until \
the Time is returned in a reply. If the sender keeps its Time, it \
continues running — effectively async. The kernel does not distinguish \
these cases. It routes the event, transfers any included resources, and \
schedules whatever has Time. \
\
Time donation for the supervision path (child → supervisor) works \
naturally: the child includes its Time, the supervisor borrows it to \
process the request, returns it in the reply. Supervisors do not need \
Time proportional to their children's workload — callers bring their \
own Time for request processing. Supervisors do need a baseline Time \
allocation for autonomous work (see supervisor-needs-time). \
\
For fire-and-forget (notifications, signals): the sender omits Time. \
The event is queued at the destination. The receiver processes on its \
own Time when scheduled. The sender continues. \
\
This dissolves sync/async into the resource model. No special call/send \
distinction. No time donation mechanism. No separate scheduling for \
sync vs. async paths. Just: events carry resources, the scheduler runs \
whatever has Time. The right behavior emerges from the right choice — \
include Time when you need the result (sync), omit Time when you don't \
(async). The wrong choice (omitting Time for a request you need) \
deadlocks only the sender and its subtree, not the system. \
\
Principle: make the right way the easy way. An Object would have to go \
out of its way to hurt itself."""

[[claim]]
id = "kernel-is-leaf-node"
statement = "The kernel is a leaf node behind an interface, e.g. syscalls + ABI + fault delivery + boot protocol"
status = "canonical"
confidence = "certain"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
The kernel is a service behind an API. Userspace never reaches into kernel \
internals. The interface is wider than syscalls alone: ABI, fault delivery \
conventions, boot protocol, and shared-memory conventions (e.g. clock page). \
The kernel is special — its interface shapes all others — but encapsulation \
still applies. Scheduling internals, page table format, and slab allocator \
design are implementation details that don't leak."""

[[claim]]
id = "complement-hardware"
statement = "The kernel complements hardware isolation, never competes — the MMU is the sole enforcement mechanism"
status = "canonical"
confidence = "certain"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
The MMU enforces page-granular isolation. The kernel manages which entries exist; \
the CPU enforces them. Each does what it's best at. The kernel never replicates \
hardware protection at a different granularity in software — that would be a \
weaker guarantee competing with a stronger one."""

[[claim]]
id = "mechanism-irreducible-policy-choice"
statement = "Mechanisms the hardware requires are irreducible — whether the kernel also owns the policy built on each mechanism is always a separate design choice"
status = "canonical"
confidence = "certain"
scope = ["kernel", "architecture"]
date = "2026-04-04"
rationale = """
The kernel must provide mechanisms that only privileged code can perform (context \
switching, page table manipulation, exception dispatch). Whether the kernel also \
owns the policy layered on each mechanism — scheduling policy, memory allocation \
policy, interrupt priority policy — is a design choice with its own tradeoffs. \
For scheduling, we chose kernel-owned policy because the coupling between policy \
and triggering events makes separation costly. Future mechanism/policy splits \
should be evaluated individually on the same basis."""

[[claim]]
id = "hardware-target"
statement = "Target: personal interactive devices (desktops, laptops, phones, tablets) — ARM64 with MMU, fixed cores, fixed RAM"
status = "canonical"
confidence = "certain"
scope = ["kernel", "hardware"]
date = "2026-04-04"
rationale = """
The device class is personal, interactive, GUI-driven: the kind of hardware that \
runs macOS or iOS. Desktops, laptops, smartphones, tablets. This excludes servers \
(different performance/reliability tradeoffs), embedded devices (resource constraints, \
no MMU assumed), and safety-critical systems (medical, military, space — certification \
requirements that dictate design). The shared characteristics of the target class: \
ARM64 with MMU, fixed CPU topology (no hot-swap), fixed RAM (no hot-add), a user \
present and interacting. These assumptions simplify the kernel significantly — no \
hot-plug, no NUMA discovery, no hard-realtime certification paths."""

[[claim]]
id = "supervision-tree"
statement = "Every Object (except the root) has exactly one supervisor, which is another Object. This forms a tree. The kernel is the supervisor of the root Object — the prime mover. Faults that propagate to the root propagate to the kernel."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
An Object that faults needs a handler. A handler that itself faults needs a \
handler. This chain must terminate. The simplest structure that provides \
per-Object fault handling with guaranteed termination is a tree rooted at \
the kernel. Each Object has exactly one supervisor — the relationship is \
unambiguous, and the tree is the fault propagation path: faults bubble up \
from Object to supervisor until caught or reaching the kernel. \
\
Making the kernel the root Object's supervisor eliminates a special case: \
the root Object is just another supervised Object, not a unique entity with \
different fault semantics. The kernel already receives exceptions via \
VBAR_EL1 and manages lifecycle — it naturally fills the supervisor role. \
\
Converges with Erlang supervision trees (same problem: reliable systems \
from unreliable parts → same shape) and React error boundaries (faults \
bubble up the component tree until caught). Genode's component tree is the \
closest kernel-level prior art, though it adds full parent mediation."""

[[claim]]
id = "unified-ownership-tree"
statement = "The supervision tree is the ownership tree. An Object owns the resources it creates (memory objects, time objects, child Objects). Shared resources live at the lowest common ancestor. When an Object is destroyed, its entire subtree is destroyed and its resources are reclaimed."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
An Object creates resources and supervised children. If the Object dies, \
what happens to them? The simplest answer: they die too. The Object that \
created something is responsible for it. This makes the supervision tree \
and the ownership tree the same structure — one relationship, not two \
overlapping graphs. \
\
Shared resources (a memory object used by two Objects in different subtrees) \
live at the lowest common ancestor, which maps it into both subtrees. This \
follows from the rule that an Object can only map resources into its own \
subtree. Cross-subtree sharing requires the common ancestor to create and \
own the shared resource. Same structural principle as React's "lift state \
to the nearest common ancestor." \
\
Recursive destruction is the default — supervisor dies, subtree dies. \
Userspace builds persistence patterns on top (a meta-supervisor that \
restarts subtrees). The kernel provides the structure; userspace provides \
the policy. Reparenting Objects across subtrees is not a kernel primitive \
because it would divorce ownership from supervision."""

[[claim]]
id = "events-unified"
statement = "Faults and interrupts are both events routed by the supervision tree. Faults enter at the faulting Object's supervisor. Interrupts enter at the delegated handler Object. Both bubble up the tree if unhandled."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
Faults and interrupts are structurally similar: an event occurs that an \
Object must handle. Faults originate from a specific Object's execution \
(bad instruction, page fault). Interrupts originate from hardware (device \
ready, timer fired). Both need a handler, and both need a fallback if the \
handler fails. \
\
The supervision tree provides both. Faults are delivered to the faulting \
Object's supervisor — "your child broke." Interrupts are delivered to \
whichever Object the interrupt was delegated to. If either handler fails \
(crashes, doesn't exist), the event bubbles up to the next supervisor. \
\
Unifying faults and interrupts as "events routed by the tree" means the \
kernel has one routing mechanism, not two. The difference is only where \
the event enters the tree (supervisor for faults, delegated handler for \
interrupts), not how it propagates."""

[[claim]]
id = "kernel-routes-events"
statement = "The kernel evaluates routing rules and delivers events directly to the destination Object. Supervisors parcel out routing capabilities to children at any time; the kernel enforces them. Intermediate supervisors are not woken unless they have registered interest (observe or consume)."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
The alternative — supervisors actively routing events by receiving and \
forwarding — requires each intermediate supervisor to sit in a receive \
loop, which is polling. Since supervisors already declared their routing \
rules when they parceled out capabilities, waking them at delivery time \
to re-answer routing questions they already answered is unnecessary work. \
\
Instead, the kernel maintains the routing structure directly. When an \
event is emitted, the kernel walks the routing rules in kernel memory — \
no context switches for intermediaries. Only the destination Object is \
woken. The routing walk is cheap (rule table lookups in kernel memory, \
a few per tree level). \
\
Events take the shortest path through the tree. Parent to child is \
direct. Child to parent is one hop (the child's event bubbles to its \
immediate supervisor). Cross-subtree events walk up to the common \
ancestor's routing rules and back down. \
\
When a child dies, its routing capabilities return to its supervisor. \
The supervisor can reassign them (to a restarted replacement or a \
different child). Events that were routed to the dead child now reach \
the supervisor instead — senders never see the failure. Recovery is \
transparent, handled at the right level of the tree."""

[[claim]]
id = "routes-are-authority"
statement = "Routes are capabilities (authority over which event types an Object receives), not a fourth object type. The external object model stays at three types: Object, Space, Time. Routing authority is part of the governance system — supervisors assign routes to children, children cannot self-select."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
A Route grants the right to receive events of a specific type. This is \
authority — governance over what reaches an Object — not a resource the \
Object consumes for execution. An Object with Space and Time but no \
Routes can still execute; it just runs in silence, receiving no external \
events. \
\
Routes follow the same pattern as other authority: the parent imposes \
them on children, they attenuate downward (a child can only receive \
event types its parent receives), and children cannot self-select. This \
prevents Objects from unilaterally claiming event types, which would \
create routing ambiguity and security holes. \
\
Making Routes a fourth object type would elevate one capability above \
others (create, destroy, map, bind). All of these are authority the \
supervisor exercises over its subtree. Routes belong in the same \
category: governance, not resources."""

[[claim]]
id = "event-types-predefined"
statement = "Events carry a single type from a flat, predefined set. Event types are globally meaningful across all tree levels. The specific type vocabulary is an OS-level ABI decision; the kernel routes on type IDs without interpreting them."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
Single type per event: routing rules map event types to children. One \
type means one unambiguous routing decision at each tree level. Multiple \
types per event would require combining type matches across ancestors, \
effectively recreating hierarchical addresses — unnecessary complexity. \
\
Predefined set: if Objects could define custom event types, they would \
need implicit inter-Object protocols — prior agreement on what types \
mean. This undermines the supervision model where the supervisor defines \
the vocabulary for its children. Objects don't know about each other; \
they emit events using types their supervisor assigned meaning to. \
\
Globally meaningful: the same type ID means the same thing at every \
tree level. An event bubbles up and routes down using one type. Level- \
scoped types would require type translation across levels, recreating \
addressing. \
\
The actual type set (hardware interrupts, fault types, and OS-defined \
application types like filesystem/network/display) is an OS convention, \
not a kernel architecture decision. The kernel just routes on the ID."""

[[claim]]
id = "events-sole-communication"
statement = "Events are the sole inter-Object communication primitive. There is no separate IPC subsystem. Small data is carried in the event payload. Bulk data uses shared Space objects with events for coordination signals."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-05"
rationale = """
Events carry a type (for routing) and a payload (for the destination). \
Small messages fit in the payload — a status code, a request descriptor, \
a fault syndrome. No shared memory setup needed. \
\
For bulk data (file contents, audio buffers, video frames), the \
supervisor maps a shared Space object into both communicating Objects. \
Data is written to shared memory (zero-copy). An event signals "data \
ready." The kernel's role in the data path is delivering the signal. \
\
This means the kernel has no message queues, no channels, no ports, no \
IPC buffers. It has event delivery (routing rules + direct delivery) \
and memory mapping (Space objects). IPC is an emergent pattern, not a \
built-in subsystem. Fewer kernel concepts, smaller attack surface, \
less mechanism to verify."""

[[claim]]
id = "tree-is-security-boundary"
statement = "The supervision tree is the visibility and security boundary. Only ancestors on the routing path between sender and receiver can observe events. Cross-subtree observation is impossible — the tree topology is the access control."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
Events travel up from the emitter and down to the destination, following \
routing rules. Only supervisors on this path can register observe or \
consume rules. A supervisor in a different subtree is never on the path \
and therefore never sees the event. No ACLs, no permission checks on \
observation — the tree topology IS the access control. \
\
This means: Root can observe everything (ancestor of all). Supervisor A \
can observe events in A's subtree. Object A1 sees only events delivered \
to A1. A malicious Object in subtree C cannot observe events between A1 \
and B2 because C is never on the routing path. \
\
Visibility attenuates downward, same as authority. A child never sees \
more than its parent can. A parent always sees at least as much as its \
children. The monotonic property holds for both authority and visibility."""

[[claim]]
id = "observe-consume-modes"
statement = "Supervisors intercept events in two modes: observe (see the event, delivery continues to destination) and consume (become the destination, must re-emit for children to see it). Observe is for passive monitoring; consume is for active filtering or dispatch."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
Most interposition is passive — logging, monitoring, debugging. The \
supervisor wants to see events without disrupting the delivery path. \
Observe delivers the event to the supervisor AND continues to the \
destination. No active routing by the supervisor, no latency impact. \
\
When a supervisor needs to actively filter, modify, or multiplex events \
(e.g., dispatching to one of several children based on payload), it \
registers as consumer. The event stops at the supervisor. The supervisor \
inspects the payload and re-emits or sends to the appropriate child. \
This is a deliberate opt-in to active routing for that event type. \
\
Both modes are declared as routing rules at setup time, not per-event \
decisions. The kernel knows the full delivery plan before any event \
arrives. Parallels DOM event model: addEventListener without \
stopPropagation is observe; with stopPropagation is consume."""

[[claim]]
id = "default-to-supervisor"
statement = "Events with no matching routing rule are delivered to the emitter's immediate supervisor. The kernel is type-agnostic — it evaluates routing rules and follows the default when none match. Supervision concerns (faults, resource requests, lifecycle) work because they are naturally unrouted."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
The kernel has one routing algorithm: walk routing rules, deliver to the \
match, fall back to the immediate supervisor if no match exists. This \
means the kernel never interprets event types — it does not distinguish \
"supervision" events from "service" events. The difference is emergent: \
supervision events (faults, resource requests) have no routing rules, so \
they always fall through to the supervisor. Service events (filesystem, \
network) have explicit routing rules, so they reach their destination. \
\
A supervisor that wants to delegate a supervision concern can: just add \
a routing rule. Route "fault" to a debugger child, route "space-request" \
to a memory manager child. The default-to-supervisor behavior is \
overridden by the explicit route. When the route is removed, the default \
resumes. No special mechanism for delegation — same routing rules as \
everything else. \
\
This eliminates the need for the kernel to categorize event types as \
"inherent" vs. "singleton" or "supervision" vs. "service." One routing \
mechanism, one default, zero type interpretation."""

[[claim]]
id = "object-visibility"
statement = "An Object knows only its direct children. It cannot see, name, or address its parent, siblings, grandchildren, or any other Object. It emits events into the tree and receives events from the tree — the routing is invisible to it."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
An Object's world is: emit events (destination unknown), receive events \
(source unknown), and if it has children, send to specific children by \
identity. That's it. The tree above, beside, and below (past one level) \
is invisible. \
\
The Object doesn't know who its supervisor is. It infers something exists \
above it because resource requests are fulfilled and events arrive, but \
it cannot name or address its supervisor. Emitting an event is not \
"sending to parent" — it's putting an event into the tree. Where it goes \
is determined by routing rules the Object cannot see. \
\
This is the strictest possible encapsulation: each Object is a black box \
that knows only its immediate subordinates. Consequences: an Object \
cannot bypass its supervisor, cannot reach into another subtree, cannot \
even discover the tree's shape. Any communication with distant Objects \
happens through the routing system, mediated by ancestors the Object \
doesn't know exist. \
\
Reply-to tokens from event exchanges don't break this: the Object can \
address "the thing that responded to my earlier event" but doesn't know \
who or where it is. An opaque reference, not an identity. \
\
This property falls out from the supervision tree and kernel routing, \
but is recorded explicitly because it defines the programming model and \
is easy to accidentally violate."""

[[claim]]
id = "boot-is-normal-supervision"
statement = "Boot is not a special protocol. The kernel creates the root Object with minimal resources and responds to its requests through the normal supervision interface. The root Object requests Space, Time, and routing capabilities incrementally as it builds the system."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
The kernel is the root Object's supervisor. Supervisors grant resources \
to children on request. Therefore, the kernel grants resources to the \
root Object on request — same interface, no special boot protocol. \
\
The kernel creates the root Object with enough to start: Space for its \
code and stack, Time for one core. The root Object emits resource \
requests (unrouted events, delivered to its supervisor — the kernel). \
The kernel grants from its pool of physical resources. The root Object \
builds the system incrementally, never holding all resources at once. \
\
Contrast with seL4, which dumps all capabilities via BootInfo at boot. \
That requires the root task to be briefly omnipotent — a single point \
of compromise holding everything. In our model, the root Object's \
authority at any moment is only what it currently holds. The kernel \
retains unallocated resources and grants on request. \
\
The kernel is the sole entity that creates resources from physical \
hardware (RAM → Space, cores → Time, IRQs → routing capabilities). \
Every other supervisor subdivides what it was given. The kernel is \
the origin of all resources — the prime mover."""

[[claim]]
id = "resource-inheritance-on-destruction"
statement = "When an Object is destroyed, its bound resources (Time, Space) return to its supervisor. Resources do not disappear — they flow up the ownership tree. The supervisor inherits the resources and may reuse them (e.g., to restart a replacement child)."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
This follows directly from the unified ownership tree: the supervisor \
owns the resources it granted to its children. When a child is \
destroyed, its resources return to the owner. Time does not vanish — \
it flows back up. This solves the 'supervisor needs time to clean up \
after dead child' problem that seL4 MCS passive servers struggle with: \
the dead child's Time becomes the supervisor's Time, which the \
supervisor uses for cleanup, restart decisions, and re-provisioning. \
\
Space objects follow the same path: unmapped from the destroyed child, \
returned to the supervisor's resource pool. The supervisor can remap \
them into a replacement child or reclaim the backing memory. \
\
Recursive destruction means an entire subtree's resources flow to the \
nearest surviving ancestor. This is natural garbage collection — the \
tree structure determines resource flow, no reference counting or \
mark-sweep needed."""

[[claim]]
id = "supervisor-needs-time"
statement = "Every active supervisor needs a baseline Time allocation for autonomous work — receiving async events, monitoring children, cleanup, and lifecycle management. Callers donate additional Time for request processing. Supervisor cost scales with responsibility, not with client load."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-05"
rationale = """
A supervisor that handles only synchronous requests from children could \
in theory run entirely on donated Time. But real supervisors also need \
to: (1) receive asynchronous events (interrupts, timer expiries, \
notifications from peers) that arrive without donated Time, (2) perform \
cleanup and restart when children die — the dead child's Time returns \
to the supervisor (per resource-inheritance-on-destruction) but the \
supervisor must be schedulable to receive it, (3) run periodic health \
checks or monitoring. \
\
Every production system that tried 'callers bring their own time' \
needed this escape hatch. Erlang supervisors are always their own \
process with CPU time. seL4 MCS passive servers cannot receive async \
notifications without their own scheduling context. \
\
The corrected model: a supervisor's baseline Time covers autonomous \
work. Donated Time from callers covers request processing on their \
behalf. The supervisor does not need Time proportional to the number \
of clients — a supervisor serving 1000 clients needs the same baseline \
as one serving 10. Client requests bring their own fuel. What 'costs \
nothing' is the scaling, not the existence."""

[[claim]]
id = "tickless-one-shot-timer"
statement = "The kernel uses one-shot timers programmed to the nearest deadline — no periodic tick. The hardware timer fires for preemption and timeouts, nothing else."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu"]
date = "2026-04-06"
rationale = """
A periodic tick is a polling pattern: wake up at fixed intervals to check \
whether anything needs attention. This wastes power on idle devices (the \
target is phones, tablets, laptops), adds interrupt overhead proportional \
to tick frequency rather than workload, and quantizes time into fixed \
slices that are always wrong — too coarse for low-latency work, too fine \
for idle efficiency.

The kernel already knows exactly when it needs the timer to fire: when \
the current Object's Time budget expires (preemption), or when the next \
timeout completes (sleep, event deadline). Programming the hardware timer \
to that exact moment is strictly better — zero wakeups when idle, \
microsecond precision when busy.

The ARM generic timer's CNTV_CVAL_EL0 supports absolute deadline \
programming natively. The sorted deadline queue replaces the tick \
counter: insert deadlines from the scheduler and timeout system, always \
program the timer to the minimum.

Every modern kernel has converged here: seL4 (one-shot, deadline-based), \
Linux (NO_HZ_FULL), QNX (tickless since 6.3.2), Zircon (deadline + timer \
slack). The v0.1 periodic tick at 100 Hz was bringup scaffolding to prove \
the timer/GIC/exception path works end-to-end."""

[[claim]]
id = "time-object-shape"
statement = "A Time object carries two values: allocation (a) and margin (m), both in nanoseconds-per-second. Allocation is the Object's claim on CPU capacity. Margin controls the flexibility range: the guaranteed floor is a-m, the ceiling is a+m. Both values are in the same unit on the same dimension — a±m is a literal arithmetic range."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu"]
date = "2026-04-07"
rationale = """
Derived from first principles during Time design exploration (2026-04-07). \
\
Single-value models were exhausted and proven insufficient: \
- Weight alone (relative share) is meaningless without a denominator the \
  Object cannot know. \
- Budget alone (consumable nanoseconds) lacks temporal dimension — doesn't \
  express urgency or period. \
- A fixed-pool weight fraction gives a knowable percentage but cannot express \
  frequency or latency. \
\
The fundamental asymmetry between Space and Time drives the two-value design: \
Space is a stock (bytes, static, persists whether used or not). Time is a \
flow (nanoseconds per second, passes whether used or not). A stock needs one \
number (amount). A flow needs at minimum two (a rate, or equivalently an \
amount and an interval). \
\
The two values serve distinct roles: \
- Allocation (a): the Object's total claim on CPU capacity, used for \
  conservation accounting and as the scheduler's primary input. \
- Margin (m): how much of that claim the Object is willing to trade from \
  its guaranteed floor for scheduling flexibility. m=0 means fully rigid \
  (floor = ceiling = a, exact allocation guaranteed). m=a means fully \
  flexible (floor = 0, ceiling = 2a, no guarantee but maximum surplus \
  absorption). \
\
Both values are nanoseconds-per-second on the same dimension. a±m is the \
literal range [floor, ceiling]. This is not a metaphor — the floor and \
ceiling are physical CPU time bounds. The margin is not an abstract weight \
in a different dimension; it is real nanoseconds moved between the \
guaranteed pool and the surplus pool."""

[[claim]]
id = "time-conservation"
statement = "Time allocation (a) is a conserved quantity. The kernel creates Time from physical CPU capacity and gives it to the root Object. Supervisors subdivide their allocation among children — children's allocations must sum to at most the parent's allocation. Time cannot be created by Objects, only subdivided and moved. Floors (a-m) cannot be overcommitted because no orthogonal dimension exists to absorb the deficit."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu"]
date = "2026-04-07"
rationale = """
Space overcommit works by borrowing from time: demand paging says 'I don't \
have the physical page now, wait, I'll fetch it.' The Object sleeps during \
the wait — the overcommit is transparent because time is effectively \
unbounded going forward. \
\
Time has no equivalent escape valve. Space (more cores) is fixed. Future \
time cannot retroactively supply missed CPU cycles — a missed millisecond \
is gone. There is no orthogonal unbounded dimension to absorb the deficit. \
Therefore Time floors (guaranteed allocations) must always be satisfiable: \
children's floors must sum to at most the parent's floor, at every level. \
Since floor = a - m and allocation a is conserved, this holds as long as \
m does not distort the accounting (enforced by m ≤ a per Time object). \
\
The kernel is the sole source of Time, creating it from physical CPU \
capacity discovered at boot (analogous to creating Space from physical \
RAM). The kernel may inflate or deflate total Time in response to hardware \
changes (core power states, asymmetric core capacity), but Objects in the \
tree can only subdivide what they hold — never create. This prevents the \
inflationary arms race that would make weight values meaningless."""

[[claim]]
id = "time-is-rate-not-budget"
statement = "Time is a rate (nanoseconds per second of CPU capacity), not a consumable budget. Time objects do not deplete as an Object runs. Donation transfers the rate, not a shrinking pool. Budget exhaustion as a failure mode does not exist."
status = "signal"
confidence = "medium"
scope = ["kernel", "cpu"]
date = "2026-04-07"
rationale = """
The budget/period model (seL4 MCS, SCHED_DEADLINE) treats Time as a \
consumable bucket: N nanoseconds per period, depleted by running, \
replenished on period boundaries. This model creates an entire class of \
problems: budget merging when preempted multiple times per period \
(replenishment slot fragmentation), budget exhaustion mid-processing on \
donated time (RFC-14), passive servers unable to receive async events \
without their own budget, and complex sporadic-server bookkeeping. \
\
Treating Time as a rate eliminates all of these. A Time object (a, m) \
represents a standing claim on CPU capacity — the Object runs at this \
rate perpetually, not until a bucket drains. Donation transfers the rate: \
the receiver's effective scheduling weight increases by the donated a, \
and the donor's drops to zero (unschedulable). On reply, the rate returns. \
No replenishment tracking. No budget merging. No exhaustion. \
\
Timeouts on donated Time are a separate concern handled by the kernel's \
one-shot timer mechanism (claim tickless-one-shot-timer), not by Time \
objects running dry. \
\
RISK: No production system has used non-depleting Time. Every system that \
started with rate semantics ended up with budget tracking internally. The \
scheduler will need per-Object consumption counters — the question is \
whether this internal bookkeeping recreates budget-depletion problems at \
the scheduler level. Non-depletion also removes a defense-in-depth layer \
(budget exhaustion as a backstop for runaway tasks) and eliminates the \
natural timeout on sync donation (explicit timeouts via the timer mechanism \
are required instead). The supervision event infrastructure should be \
designed to carry Time-usage advisory events if monitoring proves \
necessary, so that adding observability does not require new fault paths. \
This claim has medium confidence because it is the most novel and \
least-validated property of the Time design."""

[[claim]]
id = "time-splitting"
statement = "A Time object (a, m) can be split into two Time objects (a₁, m₁) and (a₂, m₂) where a₁ + a₂ = a and m₁ + m₂ = m, with m_i ≤ a_i for each piece. Splitting is how supervisors carve Time for children. Floors and ceilings are conserved across splits."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu"]
date = "2026-04-07"
rationale = """
Supervisors create children by subdividing their own resources — this is \
the same mechanism for Space and Time. A supervisor with Time (a, m) \
splits it into pieces, binding one to each child and retaining a piece \
for its own baseline needs (claim supervisor-needs-time). \
\
Conserving both a and m across the split automatically conserves floors \
and ceilings: sum of floors = sum(a_i - m_i) = a - m = original floor, \
and sum of ceilings = sum(a_i + m_i) = a + m = original ceiling. \
\
The constraint m_i ≤ a_i on each piece prevents floor distortion from \
clamping: if m_i > a_i, the floor max(0, a_i - m_i) clamps to 0 instead \
of going negative, which would silently increase the total floor beyond \
the original — violating conservation. Keeping m_i ≤ a_i ensures every \
piece has a non-negative floor without clamping, and the accounting stays \
exact. \
\
Splitting is also the mechanism underlying partial Time donation: an \
Object with Time (a, m) can split off a piece, donate that piece via an \
event (becoming partially reduced but still schedulable), and retain the \
rest. Full donation (the entire handle) is the degenerate case."""

[[claim]]
id = "time-surplus-distribution"
statement = "When Objects' guaranteed floors sum to less than available CPU capacity, the remaining cycles (surplus) are distributed by a work-conserving scheduler to runnable Objects that have not reached their ceiling. The specific scheduling algorithm and surplus distribution ratios are implementation choices, not part of the Time interface."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu"]
date = "2026-04-07"
rationale = """
The Time object defines what the kernel must guarantee (floor) and what \
it must cap (ceiling). Between these bounds, the scheduler has freedom to \
distribute CPU time using whatever algorithm best serves the target \
workload (EEVDF, BVT, behavioral inference, or future alternatives). \
\
This separation is deliberate: Time's shape (a, m) is an interface \
commitment that is hard to change. The scheduling algorithm is a leaf \
node behind that interface that can evolve. EEVDF's weight+slice model, \
Genode's BVT with warp, and LAVD's behavioral inference all operate \
within floor/ceiling constraints — any could be used without changing \
the Time object. \
\
When all runnable Objects have reached their ceilings and surplus remains, \
the CPU may idle. On personal interactive devices (the target hardware), \
idle CPU is not waste — it enables low-power states, extending battery \
life. The tickless one-shot timer (claim tickless-one-shot-timer) ensures \
zero interrupt overhead during idle periods."""

[[claim]]
id = "capability-encoded-in-tree"
statement = "Authority is encoded in the supervision tree's existing data structures — page tables for Space permissions, scheduler state for Time allocation, routing rules for event delivery. There are no separate capability objects, handle tables, or bearer tokens. The tree IS the capability space."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-08"
rationale = """
Resolves the downstream mechanism choice left open by authority-is-os-governance. \
\
The kernel already maintains page tables (which Space is mapped where, with what \
permissions), scheduler state (which Object has what Time), routing rules (which \
events go where), and the supervision tree (who supervises whom). These data \
structures already encode all authority information. A separate capability table or \
token system would be redundant indirection — a parallel bookkeeping system that \
must stay in sync with the primary one. \
\
Bearer tokens ("cash money" model) were explored and rejected: the kernel is the \
sole enforcer at every access point (MMU for memory, scheduler for CPU, event \
router for communication). Since the bouncer is already at every door, the bouncer \
keeps the guest list rather than checking tickets. Tokens for memory access \
specifically would turn every load/store into a syscall (~1000x slower than \
MMU-mapped access). \
\
The recurring pattern: authority on the kernel's side of the boundary, local \
references on the Object's side (virtual addresses for Space, implicit for Time, \
event indices for replies). Each reference is meaningless outside the Object's \
kernel-managed context — there is nothing to forge, copy, or leak. \
\
Closest prior art: Genode's component tree (sessions as implicit capabilities), \
EROS constructors (structure IS the capability space). Contrast with seL4 \
(explicit CNode objects), Zircon (handle tables), which maintain capability \
structures separate from the operational data."""

[[claim]]
id = "space-permission-vocabulary"
statement = "Space permissions are Read, Write, and Execute — three bits per mapping, enforced by the MMU hardware. Time has no permissions (authority is the allocation amount). Routes have no separate permissions (the route definition IS the permission)."
status = "signal"
confidence = "high"
scope = ["kernel", "memory", "cpu"]
date = "2026-04-08"
rationale = """
Space permissions map directly to ARM64 MMU page table entry bits: AP[2:1] \
for read/write at EL0, PXN/UXN for execute permission. The hardware checks \
these on every load, store, and instruction fetch — zero kernel overhead per \
access. Permissions attach to the mapping, not the Space object (per \
memory-object-abstraction): the same Space can be R+W in one Object and R \
in another. \
\
Time has no meaningful permission decomposition. An Object with Time can run, \
split it (if a supervisor), and donate it in events. The authority over Time \
is entirely in how much you were given — the (a, m) shape already controls \
everything. Adding "can split" or "can donate" permissions would restrict \
operations that are either implicit in being a supervisor or fundamental to \
the event model. \
\
Routes: the route definition (event type + observe/consume mode) IS the \
permission. No additional rights vocabulary needed — "child X receives event \
type T in observe mode" is the complete authority specification. \
\
This yields a notably small permission vocabulary compared to Zircon (15+ \
right types) or Capsicum (60+ rights). The small vocabulary is not a gap — \
it reflects well-shaped abstractions where each resource type has natural, \
orthogonal controls rather than a generic rights bitmask bolted on."""

[[claim]]
id = "events-emitted-not-addressed"
statement = "Events are emitted, never addressed. An Object puts an event into the routing system without knowing or naming the recipient. Routing rules (set up by supervisors) determine the destination. The sender's view: 'I emitted an event and maybe got a response.' The receiver's view: 'An event arrived.' Neither side knows the other."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-08"
rationale = """
Extends object-visibility. If Objects cannot see, name, or address other \
Objects (except direct children), then events cannot carry a destination \
address. The sender emits an event with a type; the kernel's routing \
infrastructure determines where it goes. This is dispatch, not messaging. \
\
Like DOM dispatchEvent or Redux dispatch: the emitter fires an event into \
the system, the infrastructure routes it, the emitter doesn't control or \
know the destination. Contrast with Zircon channel_write (explicitly names \
a channel handle) or seL4 Call (explicitly names an endpoint capability). \
\
This preserves: anonymity (neither side knows the other), tree-as-security- \
boundary (all routing goes through the tree), and supervision authority \
(supervisors control routing, Objects cannot self-select destinations). \
\
Parent-to-child communication is NOT events — it is a separate mechanism \
(supervision operations) because the parent necessarily knows its children \
(it created them). See two-communication-modes."""

[[claim]]
id = "reply-paths-kernel-internal"
statement = "Event replies use a kernel-internal reply path, never exposed to the Object as a value. The Object calls replyTo(event, response) — the kernel routes the response back to the original sender. The reply path cannot be inspected, copied, or forwarded. It is validated per-Object: only the actual recipient of an event can reply to it."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-08"
rationale = """
The alternative — exposing reply handles as values Objects can see and \
manipulate — creates the same problem as bearer tokens: any value in an \
Object's memory can be copied to shared Space, read by another Object, \
and used to impersonate the original recipient. This would create \
communication channels that bypass the supervision tree, violating \
tree-is-security-boundary. \
\
Instead, the kernel tracks reply paths internally: "event #7 was delivered \
to Object B, reply routes to Object A." When B calls replyTo(7, response), \
the kernel validates that event #7 was indeed delivered to B, then routes \
the response to A. The event index (7) is per-Object — B's event #7 and \
C's event #7 are unrelated, like file descriptors in different processes. \
Copying the integer to another Object via shared Space is meaningless. \
\
Reply paths are one-use. For ongoing conversation, each reply carries a \
fresh reply path from the responder. Either side can end the conversation \
by not replying. No persistent channels, no cleanup, no handle lifecycle. \
\
This is the governance-not-tokens principle applied to replies: the routing \
authority lives in the kernel's data structures, not in anything the Object \
possesses. Same pattern as page tables (Space authority), scheduler state \
(Time authority), and routing rules (event delivery authority)."""

[[claim]]
id = "two-communication-modes"
statement = "The kernel provides two communication modes: events (emitted, anonymous, type-routed, for peer communication) and supervision operations (parent-to-specific-child, kernel-mediated, for resource management and lifecycle). Events and supervision operations are distinct mechanisms serving distinct relationships."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-08"
rationale = """
Two relationships exist in the supervision tree, and each needs its own \
communication pattern: \
\
(1) Peers — Objects that don't know each other, connected by routing rules. \
Events serve this relationship: emitted without destination, type-routed, \
anonymous. Neither side knows the other. The routing infrastructure (set up \
by supervisors) connects them. \
\
(2) Parent and child — Objects in a known hierarchical relationship, \
connected by creation. Supervision operations serve this relationship: the \
parent tells the kernel to do things to/for a specific child (map Space, \
assign Time, set routing rules, destroy). The parent names the child by \
kernel-assigned ID. \
\
Merging these into one mechanism would require either: events that can be \
addressed (violating events-emitted-not-addressed and tree-is-security- \
boundary), or supervision operations that are anonymous (making resource \
management impossible — you must name the child you're configuring). \
\
The split mirrors React's distinction: props flow parent→child (direct, \
parent knows the child), while context and events flow through the tree \
(indirect, producer doesn't know consumers). Both are needed; neither \
subsumes the other."""

[[claim]]
id = "event-resource-slots"
statement = "An event carries at most one optional Time slot and one optional Space slot, plus a payload. Time is fungible (combine before sending if needed). One Space slot covers the common case; complex sharing (multiple regions, different permissions) uses multiple events at setup time."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-07"
rationale = """
Time is fungible — any nanosecond-per-second is identical to any other. If \
an Object holds multiple Time fragments, it combines them before sending. \
One slot suffices because there is no reason to send distinguishable Time \
pieces in a single event. \
\
Space is NOT fungible — each Space object has identity, backing type, and \
sharing state. A single Space slot still covers the common case: sharing one \
region for a data buffer, transferring one allocation to a child, donating \
one page of results. Complex sharing (multiple regions with different \
permissions between two Objects) is a setup-time concern: the supervisor \
sends multiple events, each carrying one Space with its own permissions. \
Once shared regions are established, ongoing communication uses the payload \
(small data) or writes to already-shared Space (bulk data) with events as \
signals. \
\
More slots would widen the event structure for a rare case. Fewer slots \
(zero) would require a separate resource-transfer mechanism alongside \
events, violating events-sole-communication. One of each hits the sweet \
spot: the common case is one syscall, the complex case is N syscalls."""

[[claim]]
id = "sender-identity-via-badge"
statement = "The sender's identity is conveyed by a badge — an integer set by the supervisor on the routing rule, not by the sender. The sender cannot choose or forge its own badge. The receiver sees the badge but not the sender's identity or tree position."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-07"
rationale = """
Events are anonymous — the sender doesn't know the receiver and the receiver \
doesn't know the sender (events-emitted-not-addressed). But receivers often \
need to distinguish between different clients: a file server handling requests \
from multiple Objects needs to know which session each request belongs to. \
\
The badge solves this without breaking anonymity. The supervisor assigns a \
badge value when it creates a routing rule: "events of type T from child A \
carry badge 42." The kernel attaches the badge at delivery. The receiver sees \
badge 42 and can associate it with a session, but learns nothing about the \
sender's identity or location in the tree. \
\
Critically, the sender cannot set its own badge — only the supervisor can \
(via the routing rule). This prevents impersonation: Object A cannot claim \
to be Object B by forging B's badge. The supervisor, which created both A \
and B, is the sole authority on badge assignment. \
\
seL4 uses the same mechanism: badges are minted onto endpoint capabilities \
by the authority that created them. Zircon achieves similar sender \
disambiguation through separate channel handles per client."""

[[claim]]
id = "time-is-fungible"
statement = "Time is fungible — any nanosecond-per-second of CPU capacity is identical to any other. Two Time objects with the same (a, m) are interchangeable. Space is NOT fungible — each Space object has identity, backing type, sharing state, and is distinguishable from any other Space of the same size."
status = "signal"
confidence = "high"
scope = ["kernel", "cpu", "memory"]
date = "2026-04-07"
rationale = """
Time fungibility follows from Time being a rate claim on a uniform resource \
(CPU cycles). A nanosecond-per-second from one Time object is physically \
identical to a nanosecond-per-second from another — they schedule the same \
CPU, produce the same computation. Two Time objects can be combined (summing \
a and m) or split without loss of identity, because there is no identity to \
lose. This is why one optional Time slot per event suffices (combine before \
sending) and why Time handles don't need to be tracked individually. \
\
Space non-fungibility follows from Space having properties beyond size: \
backing type (anonymous RAM, device MMIO, file-backed), sharing state \
(mapped into which Objects, with what permissions), contents (the actual \
bytes stored). Two 4KB Space objects are not interchangeable — they contain \
different data, may be backed differently, and may be shared with different \
Objects. This is why Space objects need individual identity and why \
transferring Space is structurally different from transferring Time. \
\
This asymmetry (fungible Time, non-fungible Space) drives several design \
decisions: Time splitting is pure arithmetic, Space splitting produces \
distinguishable children. Time donation is reversible (return the same rate), \
Space sharing creates persistent mappings that must be explicitly managed."""

[[claim]]
id = "space-named-by-virtual-address"
statement = "An Object refers to Space by its virtual address — the address where the Space is mapped in the Object's address space. The page table IS the naming mechanism. No separate handle table or ID system exists for Space. If you manage it, it's in your address space."
status = "signal"
confidence = "high"
scope = ["kernel", "memory"]
date = "2026-04-08"
rationale = """
Space that is mapped into an Object's address space already has a natural \
name: the virtual address range. Using virtual addresses as names avoids \
introducing a parallel naming system (handles, IDs) that would need to \
stay in sync with the page tables the kernel already maintains. \
\
Supervisors map managed Space into their own address space. A supervisor \
overseeing children's memory maps that memory into itself — this provides \
both a name (the VA) and direct access (for initialization, inspection, \
fault handling, debugging). When the supervisor shares Space with a child, \
it tells the kernel "map the Space at my VA 0x5000 into child C at some \
address, with read-only permissions." The kernel resolves the supervisor's \
VA to the underlying Space object via the page table and creates the \
child's mapping. \
\
For runtime allocations (child requests more Space), the kernel picks the \
VA in the child's address space and reports it in the response event. The \
child doesn't choose addresses for its own runtime allocations — the \
kernel optimizes placement (alignment, fragmentation avoidance, ASLR). \
For initial setup (loading a program), the supervisor specifies VAs based \
on program requirements (ELF headers or loader decisions). \
\
The 48-bit ARM64 virtual address space (256TB) is large enough that a \
supervisor mapping all managed Space into itself is not a practical \
constraint on personal devices."""

[[claim]]
id = "space-permission-attenuation"
statement = "When Space is shared or transferred via events, permissions can only decrease or stay equal — never increase. The sender specifies the recipient's permissions, which must be a subset of the sender's own. The kernel enforces this monotonicity at event delivery."
status = "signal"
confidence = "high"
scope = ["kernel", "memory", "ipc"]
date = "2026-04-08"
rationale = """
Monotonic attenuation is the only safe direction for permission delegation. \
If a recipient could escalate permissions (receive read-only, upgrade to \
read-write), the entire permission model collapses — any Object could gain \
arbitrary access by requesting escalation. \
\
The sender attenuates at send time: "share my Space (which I hold as r+w) \
with the recipient as read-only." The event's Space slot carries the \
permission annotation. The kernel validates at delivery: are the requested \
recipient permissions ≤ the sender's permissions? If yes, the kernel \
creates the recipient's mapping with the attenuated permissions. If no, \
the event is rejected. \
\
With direct kernel delivery (kernel-routes-events), there are no \
intermediate hops that need to attenuate. The sender specifies permissions \
once, the kernel enforces once, the recipient gets a mapping. Supervisors \
on the routing path who observe the event can see the Space transfer \
happening but cannot modify the permissions in flight — observation is \
passive (observe-consume-modes). A supervisor that needs to enforce \
additional permission policy should consume the event and re-emit with \
its own permission decisions. \
\
This is the same monotonicity property that CHERI enforces in hardware \
(CSetBounds narrows, CAndPerm clears bits, no instruction exists to \
widen). The principle is identical; the enforcement layer differs \
(kernel at event delivery vs. hardware at pointer derivation)."""

[[claim]]
id = "events-immutable-in-flight"
statement = "Events are immutable in flight. No entity — including observing supervisors — can alter an event's type, payload, resource slots, or permissions during delivery. Observers receive a copy asynchronously. A supervisor that needs to transform an event must switch from observe to consume mode and emit a new event to the original destination."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture", "ipc"]
date = "2026-04-08"
rationale = """
Follows directly from the observe/consume distinction (observe-consume-modes) \
and the attenuation model (space-permission-attenuation). \
\
Observe mode is defined as passive: "see the event, delivery continues to \
destination." If observers could mutate the event, the receiver would get a \
different event than the sender emitted — breaking the sender's semantic \
contract with the eventual consumer. The event that arrives must be the event \
that was sent; observation is read-only. \
\
Observers receive their copy asynchronously — on their own Time, without \
blocking the delivery path. This preserves the hot-path performance: the \
kernel delivers the event directly to the destination (kernel-routes-events) \
and notifies observers separately. An observer that takes a long time to \
process does not delay the receiver. \
\
The upgrade path for transformation is explicit: switch the routing rule from \
observe to consume. A consuming supervisor becomes the destination, receives \
the event, and may emit a new event (with different payload, attenuated \
permissions, or to a different child) as a fresh act of emission. This new \
event is subject to all normal rules (attenuation monotonicity, routing). \
The original event is consumed — it ceases to exist. The new event is a \
distinct event with its own identity. \
\
This eliminates an entire class of bugs: no event can be silently modified \
by an intermediate layer. If the receiver gets the event, it is exactly what \
the sender emitted. If it doesn't get the event, a consumer intercepted it \
(and the sender can be informed via the absence of a reply)."""

[[claim]]
id = "supervision-indivisible"
statement = "Supervision is indivisible. A child has exactly one supervisor with full authority over its lifecycle, resources, and routing. There is no partial delegation of supervision powers. Other Objects that need to act on a child do so by requesting action from the child's supervisor via events — the supervisor mediates and applies policy."
status = "signal"
confidence = "medium"
scope = ["kernel", "architecture"]
date = "2026-04-08"
rationale = """
Partial delegation (splitting supervision authority across multiple Objects) \
was explored and found to have no user-facing scenario that the existing \
design cannot already handle. Every candidate use case — device management, \
memory pools, debugging — resolves to: send a request event to the child's \
supervisor, which already has full context and applies policy. \
\
Partial delegation would require a permission vocabulary for supervision \
operations (can_map_space, can_set_routes, can_destroy, etc.) and would \
create distributed authority: who arbitrates when the Space-delegatee and \
the Time-delegatee make conflicting decisions? The supervisor's mediation \
is not overhead — it is where safety lives. \
\
Migration (moving a child to a different supervisor) does not require a \
kernel primitive. The pattern is: the current supervisor sends the child's \
state (Space, Time, payload metadata) to the new supervisor via an event, \
destroys the old child, and the new supervisor creates a fresh child from \
the received state. The kernel sees normal operations: destroy, event, \
create. Migration is an emergent userspace pattern, not a mechanism. \
\
This pattern works cleanly for leaf Objects. For Objects with deep subtrees, \
reconstructing the entire subtree is complex — effectively a distributed \
checkpoint. No user-facing scenario has been identified that requires \
subtree migration, but the possibility has not been fully explored. \
\
Medium confidence because: (1) subtree migration may prove necessary for \
scenarios not yet considered, and (2) the event-mediated approach adds one \
hop of latency per operation, which may matter for high-frequency \
supervision interactions not yet identified."""

[[claim]]
id = "program-loading-is-userspace"
statement = "Program loading (ELF parsing, address layout decisions, dynamic linking) is a userspace library or service, not a kernel concern. The kernel provides generic primitives — create Space, map at address with permissions — and is unaware of executable formats."
status = "signal"
confidence = "high"
scope = ["kernel", "architecture"]
date = "2026-04-08"
rationale = """
ELF parsing is complex, format-specific, and changes over time (new segment \
types, new relocation formats, new ABI conventions). It belongs in a leaf \
node — a userspace library or service — behind the kernel's simple mapping \
interface. \
\
The kernel's interface for setting up a child's address space is generic: \
map(space, child, address, permissions). Where the address comes from is \
not the kernel's concern — it could be read from ELF program headers by a \
loader library, chosen by the kernel for ASLR, or specified by the child \
itself for runtime allocations. The kernel validates that the mapping is \
legal (address is available, supervisor has authority over the Space and \
child) and sets up the page table. \
\
Supervisors that launch programs USE a loader library; they don't BECOME \
loaders. A supervisor that never launches programs (a resource manager, a \
router) doesn't need the library at all. The loading complexity exists \
exactly once (in the library), serves all supervisors, and can be replaced \
if the executable format changes — no kernel modification needed. \
\
This follows push-complexity-to-leaves: the format-specific complexity is \
in a leaf node, the kernel interface absorbs the variation, and the \
executable format can evolve independently of the kernel."""
