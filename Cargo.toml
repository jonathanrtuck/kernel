[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
autotests = false

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[dev-dependencies]
proptest = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3

[dev-dependencies]
proptest = "1"
